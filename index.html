<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Pesanan</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#17202a;background:#f4f7f5}
*{box-sizing:border-box}body{margin:0;background:#f4f7f5}.app{max-width:520px;margin:auto;min-height:100vh;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:23px;margin:0}.muted{color:#667085;font-size:13px}
button{border:0;border-radius:12px;min-height:44px;padding:9px 14px;font-weight:700;cursor:pointer}
.primary{background:#16834b;color:white}.secondary{background:white;border:1px solid #d9e0dc;color:#17202a}
.panel{background:white;border:1px solid #e0e6e2;border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:#667085;margin-bottom:5px}
input{width:100%;min-height:44px;border:1px solid #d9e0dc;border-radius:10px;padding:9px 11px;font-size:16px;outline:none}
input:focus{border-color:#16834b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:white;border:1px solid #e0e6e2;border-radius:15px;padding:13px}
.icon{font-size:30px}.name{font-weight:800;margin-top:4px}.price{font-size:13px;color:#667085}
.qty{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
.qty button{width:44px;padding:0;font-size:21px;background:#eef7f1;color:#16834b}
.qty span{font-size:19px;font-weight:800}
.totalbox{background:#eaf7ef;border:1px solid #bfe4cc;border-radius:16px;padding:15px;margin-top:12px}
.total{font-size:27px;font-weight:900;margin:3px 0 10px}
.actions{display:flex;gap:8px}.actions button{flex:1}
.order{background:white;border:1px solid #e0e6e2;border-radius:14px;padding:12px;margin-top:9px}
.orderhead{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.orderitems{color:#667085;font-size:13px;margin-top:6px;line-height:1.5}
.ordertime{color:#667085;font-size:12px;margin-top:5px}
.empty{text-align:center;color:#667085;padding:18px 5px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1>🧾 Kasir Pesanan</h1><div class="muted">Satu pelanggan = satu pesanan</div></div>
<button class="primary" id="newBtn">＋ Baru</button>
</header>

<div class="panel">
<label for="customer">Nama pelanggan / nomor meja</label>
<input id="customer" placeholder="Contoh: Meja 1 / Bapak Andi">
</div>

<div class="grid">
<div class="item"><div class="icon">🍗</div><div class="name">Ayam</div><div class="price">Rp21.000</div><div class="qty"><button data-i="0" data-d="-1">−</button><span id="q0">0</span><button data-i="0" data-d="1">＋</button></div></div>
<div class="item"><div class="icon">🍚</div><div class="name">Nasi</div><div class="price">Rp6.000</div><div class="qty"><button data-i="1" data-d="-1">−</button><span id="q1">0</span><button data-i="1" data-d="1">＋</button></div></div>
<div class="item"><div class="icon">🥢</div><div class="name">Tahu / Tempe</div><div class="price">Rp5.000</div><div class="qty"><button data-i="2" data-d="-1">−</button><span id="q2">0</span><button data-i="2" data-d="1">＋</button></div></div>
<div class="item"><div class="icon">🍢</div><div class="name">Ampela</div><div class="price">Rp10.000</div><div class="qty"><button data-i="3" data-d="-1">−</button><span id="q3">0</span><button data-i="3" data-d="1">＋</button></div></div>
</div>

<div class="totalbox">
<div class="muted">TOTAL PESANAN</div><div class="total" id="total">Rp0</div>
<div class="actions"><button class="primary" id="saveBtn">💾 Simpan</button><button class="secondary" id="clearBtn">Kosongkan</button></div>
</div>

<div class="panel">
<div style="font-size:18px;font-weight:900">📊 Informasi Total Pesanan</div>
<div class="grid" style="margin-top:10px">
<div class="item"><div class="muted">Jumlah Pesanan</div><div id="orderCount" style="font-size:22px;font-weight:900">0</div></div>
<div class="item"><div class="muted">Total Item</div><div id="itemCount" style="font-size:22px;font-weight:900">0</div></div>
</div>
<div style="margin-top:10px"><div class="muted">Total Penjualan</div><div id="salesTotal" style="font-size:26px;font-weight:900">Rp0</div></div>
</div>

<div class="panel">
<div style="font-size:18px;font-weight:900">📋 Daftar Pesanan</div>
<div id="orders" class="empty">Belum ada pesanan.</div>
</div>
</div>

<script>
const prices=[21000,6000,5000,10000];
const names=['Ayam','Nasi','Tahu/Tempe','Ampela'];
const icons=['🍗','🍚','🥢','🍢'];
const STORAGE_KEY='kasir_pesanan_v2';
let qty=[0,0,0,0], orders=[], number=0;
const money=n=>'Rp'+new Intl.NumberFormat('id-ID').format(n);

function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved){
      orders=Array.isArray(saved.orders)?saved.orders:[];
      number=Number(saved.number)||0;
    }
  }catch(e){
    console.warn('Data lama tidak dapat dibaca:',e);
    orders=[]; number=0;
  }
}
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({orders,number}));
}
function total(){return qty.reduce((s,v,i)=>s+v*prices[i],0)}
function formatDateTime(iso){
  return new Intl.DateTimeFormat('id-ID',{
    day:'2-digit',month:'2-digit',year:'numeric',
    hour:'2-digit',minute:'2-digit',second:'2-digit'
  }).format(new Date(iso));
}
function render(){
  qty.forEach((v,i)=>document.getElementById('q'+i).textContent=v);
  document.getElementById('total').textContent=money(total());
}
function renderOrders(){
  const box=document.getElementById('orders');
  if(!orders.length){
    box.className='empty';
    box.textContent='Belum ada pesanan.';
    return;
  }
  box.className='';
  box.innerHTML=orders.map(o=>`
    <div class="order">
      <div class="orderhead"><span>#${o.number} ${o.customer}</span><span>${money(o.total)}</span></div>
      <div class="ordertime">🕒 ${formatDateTime(o.createdAt)}</div>
      <div class="orderitems">${o.items}</div>
    </div>`).join('');
}
function updateSummary(){
  const itemCount=orders.reduce((s,o)=>s+o.itemsCount,0);
  const sales=orders.reduce((s,o)=>s+o.total,0);
  document.getElementById('orderCount').textContent=orders.length;
  document.getElementById('itemCount').textContent=itemCount;
  document.getElementById('salesTotal').textContent=money(sales);
  renderOrders();
}
function clearOrder(){
  qty=[0,0,0,0];
  document.getElementById('customer').value='';
  render();
}
document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i,d=+b.dataset.d;
  qty[i]=Math.max(0,qty[i]+d);
  render();
}));
document.getElementById('clearBtn').addEventListener('click',clearOrder);
document.getElementById('newBtn').addEventListener('click',()=>{
  clearOrder();
  document.getElementById('customer').focus();
});
document.getElementById('saveBtn').addEventListener('click',()=>{
  const t=total();
  if(!t){alert('Pilih menu terlebih dahulu.');return;}
  number++;
  const customer=document.getElementById('customer').value.trim()||'Pelanggan';
  const items=qty.map((v,i)=>v?`${icons[i]} ${names[i]} × ${v}`:'').filter(Boolean).join(' • ');
  orders.unshift({
    number,customer,items,total:t,
    itemsCount:qty.reduce((s,v)=>s+v,0),
    createdAt:new Date().toISOString()
  });
  saveData();
  updateSummary();
  clearOrder();
});
loadData();
updateSummary();
render();
</script>
</body>
</html>
